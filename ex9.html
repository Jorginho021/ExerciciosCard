<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Semáforo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(300deg, #0d3b66, #296d9b, #86bbd8);
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .semaforo {
      width: 100px;
      height: 300px;
      background-color: #333;
      border-radius: 30px;
      margin: 20px auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
        
        .luz {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 10px 0;
            background-color: #ccc;
        }
        .input {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercício 9: Simulador de Semáforo</h1>
        <div class="semáforo">
            <div id="vermelho" class="luz"></div>
            <div id="amarelo" class="luz"></div>
            <div id="verde" class="luz"></div>
        </div>
        <button class="btn" onclick="mudarSemaforo('vermelho')">Vermelho</button>
        <button class="btn" onclick="mudarSemaforo('amarelo')">Amarelo</button>
        <button class="btn" onclick="mudarSemaforo('verde')">Verde</button>
        <a href="../index.html" class="btn">Voltar para a Página Principal</a>
    </div>

    <script>
        function mudarSemaforo(cor) {
            document.getElementById("vermelho").style.backgroundColor = (cor === 'vermelho') ? 'red' : '#ccc';
            document.getElementById("amarelo").style.backgroundColor = (cor === 'amarelo') ? 'yellow' : '#ccc';
            document.getElementById("verde").style.backgroundColor = (cor === 'verde') ? 'green' : '#ccc';
        }
    </script>
</body>
</html>
