<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Semáforo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000; /* Fundo preto */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background-color: #1c1c1c; /* Fundo escuro para destacar */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .semaforo {
            width: 100px;
            height: 300px;
            background-color: #333;
            border-radius: 30px;
            margin: 20px auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .luz {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 10px 0;
            background-color: #ccc;
        }

        .btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: white;">Exercício 9: Simulador de Semáforo</h1>
        <div class="semaforo">
            <div id="vermelho" class="luz"></div>
            <div id="amarelo" class="luz"></div>
            <div id="verde" class="luz"></div>
        </div>
        <button class="btn" onclick="mudarSemaforo('vermelho')">Vermelho</button>
        <button class="btn" onclick="mudarSemaforo('amarelo')">Amarelo</button>
        <button class="btn" onclick="mudarSemaforo('verde')">Verde</button>
        <a href="index.html" class="btn">Voltar para a Página Principal</a>
    </div>

    <script>
     function mudarSemaforo(cor) {
    let semaforo = document.getElementById("semaforo");

    if (cor === "vermelho") {
        semaforo.style.backgroundColor = "red";
        semaforo.innerText = "Vermelho - Pare!";
    } else if (cor === "amarelo") {
        semaforo.style.backgroundColor = "yellow";
        semaforo.innerText = "Amarelo - Atenção!";
    } else if (cor === "verde") {
        semaforo.style.backgroundColor = "green";
        semaforo.innerText = "Verde - Pode ir!";
    }
}
   
    </script>
</body>
</html>
